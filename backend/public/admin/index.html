<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkinDiagnostics.ai — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" fill="none" width="48" height="48">
          <defs>
            <linearGradient id="lg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7B5CFF"/><stop offset=".55" stop-color="#FF5EA8"/><stop offset="1" stop-color="#5AD7FF"/>
            </linearGradient>
          </defs>
          <path d="M30 6c2 8-2 14-10 18 8-2 14 2 18 10-2-8 2-14 10-18-8 2-14-2-18-10Z" fill="url(#lg)" opacity=".95"/>
          <path d="M16 28c1.5 6-1.5 10.5-7.5 13.5 6-1.5 10.5 1.5 13.5 7.5-1.5-6 1.5-10.5 7.5-13.5-6 1.5-10.5-1.5-13.5-7.5Z" fill="url(#lg)" opacity=".85"/>
        </svg>
        <h1>SkinDiagnostics<span>.ai</span></h1>
        <p>Admin Dashboard</p>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="admin" required autofocus />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Password" required />
        </div>
        <div id="login-error" class="form-error"></div>
        <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg viewBox="0 0 64 64" fill="none" width="30" height="30">
          <defs>
            <linearGradient id="lg2" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7B5CFF"/><stop offset=".55" stop-color="#FF5EA8"/><stop offset="1" stop-color="#5AD7FF"/>
            </linearGradient>
          </defs>
          <path d="M30 6c2 8-2 14-10 18 8-2 14 2 18 10-2-8 2-14 10-18-8 2-14-2-18-10Z" fill="url(#lg2)" opacity=".95"/>
          <path d="M16 28c1.5 6-1.5 10.5-7.5 13.5 6-1.5 10.5 1.5 13.5 7.5-1.5-6 1.5-10.5 7.5-13.5-6 1.5-10.5-1.5-13.5-7.5Z" fill="url(#lg2)" opacity=".85"/>
        </svg>
        <span>Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#users" class="nav-item" data-view="users">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </a>
        <a href="#plans" class="nav-item" data-view="plans">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Plans</span>
        </a>
        <a href="#settings" class="nav-item" data-view="settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-item logout-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <button id="mobile-menu-btn" class="mobile-menu-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 id="page-title">Dashboard</h2>
        <div class="top-bar-right">
          <span id="admin-name" class="admin-badge">admin</span>
        </div>
      </header>
      <div id="view-container" class="view-container"></div>
    </main>
  </div>

  <!-- Modal Backdrop -->
  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button id="modal-close" class="modal-close">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
