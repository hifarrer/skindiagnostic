services:
  - type: static
    name: aimakeup-frontend
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./web-build
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_FACEBOOK_APP_ID
        sync: false
      - key: EXPO_ROUTER_APP_ROOT
        value: .
